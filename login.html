<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Trainer</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <main class="corpo">
        <nav id="menu" class="menu">
            <div class="logo">
                <p>Personal<span>Pro</span></p>
                <button id="btnMenu" class="btn-menu">
                    <i class="bi bi-list"></i>
                </button>
            </div>
            <ul>
                <li><a href="#home"><i class="bi bi-house"></i><span> Home</span></a></li>
                <li><a href="#sobre"><i class="bi bi-person"></i><span> Sobre</span></a></li>
                <li><a href="#servicos"><i class="bi bi-briefcase"></i><span> Serviços</span></a></li>
                <li><a href="#depoimentos"><i class="bi bi-chat-quote"></i><span> Depoimentos</span></a></li>
                <li><a href="#contato"><i class="bi bi-chat"></i><span> Contato</span></a></li>
                <li>
                    <a href="#">
                        <i class="bi bi-person-check"></i>
                        <span>Nome Usuário</span>
                    </a>

                </li>
            </ul>
        </nav>
        <div class="conteudo">
            <div class="corpo-login">

                <div class="logo login-title">
                    <h2>Personal<span>Pro</span></h2>
                    <button id="btnMenu" class="btn-menu">
                        <i class="bi bi-list"></i>
                    </button>
                    <p>Área Restrita Administrativa</p>
                </div>

                <form method="post">

                    <div class="error-form">
                        Usuário ou senha inválidos.
                    </div>

                    <div class="div-input">
                        <label for="id_username">Usuário</label>
                        <input type="text" name="username" id="id_username" required>
                    </div>

                    <div class="div-input">
                        <label for="id_password">Senha</label>
                        <input type="password" name="password" id="id_password" required>
                    </div>

                    <button type="submit">
                        Entrar no Sistema
                    </button>
                </form>

                <div style="margin-top: 25px; text-align: center;">
                    <a href="/">← Voltar
                        para o site</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="footer-logo">Personal<span>Pro</span></p>

        <p class="footer-texto">
            © 2026 PersonalPro • Todos os direitos reservados
        </p>
    </footer>
    <script>
        const btnMenu = document.getElementById('btnMenu');

        // Seleciona o cabeçalho pelo ID
        const menuResp = document.getElementById('menu');

        // pega o <i> que está dentro do botão
        const icone = btnMenu.querySelector("i");

        // Evento de clique
        btnMenu.addEventListener('click', () => {

            // Alterna a classe 'expandido'
            menuResp.classList.toggle('expandido');
            // Alterna entre dois ícones
            icone.classList.toggle("bi-list");
            icone.classList.toggle("bi-x");

        });

    </script>
</body>

</html>
